<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion Store</title>
    <link
      href="https://db.onlinewebfonts.com/c/2f7259ecfaa5e475102e4002d64ce981?family=Beatrice+Deck+Trial+Medium"
      rel="stylesheet"
      type="text/css"
    />

    <link
      href="https://db.onlinewebfonts.com/c/7bc77e0a98b9e9bbd8111c7797f39bf6?family=Beatrice+Deck+Trial+Extrabold"
      rel="stylesheet"
      type="text/css"
    />

    <link
      href="https://db.onlinewebfonts.com/c/2b7f9b31ebefea7623dbb31bf545b7ab?family=Beatrice+Deck+Trial+Thin"
      rel="stylesheet"
      type="text/css"
    />

    <link
      href="https://db.onlinewebfonts.com/c/1130e1ae4e4a76c7118c0b35c4b9d019?family=Inter"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <!-- Left Side -->
      <div class="image">
        <img src="Images/Group 36.png" alt="" />
        <div class="alignment">
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Collections</a></li>
            <li><a href="#">Deals</a></li>
          </ul>
        </div>
      </div>

      <!-- Middle Image -->
      <div class="arrow">
        <img src="Images/Group 53.png" alt="" />
      </div>
      <!-- Right Side -->
      <div class="right-side">
        <img src="Images/Group 8.png" alt="" class="heart" />

        <div class="cart-icon">
          <button class="cart-button">Cart</button>

          <img src="Images/Group 7.png" alt="" />
        </div>
        <img src="Images/Group 6.png" alt="" class="user-icon" />
      </div>
    </header>

    <main class="product-detail-container">
      <div class="main-image">
        <img src="Images/Rectangle 13.png" alt="Abstract print shirt" />
      </div>

      <div class="thumbnails-col">
        <img src="Images/Rectangle 9.png" alt="" class="active" />
        <img src="Images/Rectangle 5.png" alt="" />
        <img src="Images/Rectangle 6.png" alt="" />
        <img src="Images/Rectangle 7.png" alt="" />
        <img src="Images/Rectangle 8.png" alt="" />
      </div>

      <div class="product-info-card">
        <h3 class="product-name">ABSTRACT PRINT SHIRT</h3>
        <p class="tax-price">$99</p>
        <span class="tax-info">MRP incl. of all taxes</span>

        <p class="description">
          Relaxed fit shirt. Camp collar and short sleeves. Button-up front.
        </p>

        <div class="color-section">
          <label>Color</label>
          <div class="color-options">
            <span class="swatch color-white"></span>
            <span class="swatch color-black"></span>
            <span class="swatch color-mint"></span>
            <span class="swatch color-lavender"></span>
            <span class="swatch color-white"></span>
            <span class="swatch color-purple"></span>
          </div>
        </div>

        <div class="size-section">
          <div class="size-header">
            <label>Size</label>
          </div>
          <div class="size-options">
            <button>XS</button>
            <button>S</button>
            <button>M</button>
            <button>L</button>
            <button>XL</button>
            <button>2X</button>
          </div>
          <a href="#" class="size-guide">FIND YOUR SIZE | MEASUREMENT GUIDE</a>
        </div>

        <a href="shipping.html"> <button class="add-btn">ADD</button></a>
      </div>
    </main>
  </body>
</html>
